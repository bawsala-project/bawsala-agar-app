<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Cream rounded square -->
  <rect width="100" height="100" rx="28" fill="#F3EFE7" stroke="#BDC4D4" stroke-width="2"/>
  
  <!-- Outer hairline ring -->
  <circle cx="50" cy="50" r="40" stroke="#0F1A2B" stroke-opacity="0.3" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="33" stroke="#52677D" stroke-opacity="0.25" stroke-dasharray="2 3" stroke-width="0.8"/>

  <!-- North Diamond Marker -->
  <polygon points="50,6 52.5,9.5 50,12 47.5,9.5" fill="#0F1A2B"/>

  <!-- Cardinal Tick Marks -->
  <line x1="50" y1="14" x2="50" y2="19" stroke="#0F1A2B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="81" x2="50" y2="86" stroke="#0F1A2B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="19" y2="50" stroke="#0F1A2B" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="81" y1="50" x2="86" y2="50" stroke="#0F1A2B" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Needle -->
  <g transform="rotate(15 50 50)">
    <polygon points="50,13 53.5,50 50,87" fill="#0F1A2B"/>
    <polygon points="50,13 46.5,50 50,87" fill="#52677D" fill-opacity="0.6"/>
    <!-- Center Pivot -->
    <circle cx="50" cy="50" r="3.5" fill="#0F1A2B"/>
    <circle cx="50" cy="50" r="1.4" fill="#F3EFE7"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>كليبر بوصلة العقار</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      background: #fafafa;
      color: #111827;
      direction: rtl;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e5e7eb;
    }
    .icon {
      font-size: 20px;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      color: #1d4ed8;
      margin: 0;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
    }
    .page-info {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      margin-bottom: 12px;
      word-break: break-all;
    }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      min-height: 18px;
    }
    .status.success { color: #059669; font-weight: bold; }
    .status.error { color: #dc2626; font-weight: bold; }
    .status.loading { color: #2563eb; }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">📌</span>
    <h1 class="title">كليبر بوصلة العقار</h1>
  </div>

  <div class="field">
    <label for="serverUrl">رابط بوصلة (Local / Hosted):</label>
    <input type="text" id="serverUrl" value="http://localhost:3000">
  </div>

  <div class="field">
    <label for="caseId">معرّف القرار (Case ID):</label>
    <input type="text" id="caseId" placeholder="الصق معرّف القرار هنا">
  </div>

  <div class="page-info">
    <strong id="tabTitle">جارٍ فحص التبويب الحالي...</strong>
  </div>

  <button id="clipBtn" class="btn">
    <span>استيراد العقار فوراً</span>
  </button>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
